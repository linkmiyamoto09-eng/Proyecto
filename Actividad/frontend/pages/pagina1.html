<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 1 - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <header>
    <h1>Acceso a la Plataforma</h1>
  </header>

  <main>
    <section class="form-container">
      <img id="logo" 
     src="../img/logo.png" 
     alt="Logo" 
     style="width: 60px; height: 60px; object-fit: contain; margin-bottom: 1rem; border-radius: 8px;" 
     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 60 60\'><rect width=\'60\' height=\'60\' rx=\'12\' fill=\'%232A2F63\'/><text x=\'50%\' y=\'55%\' font-size=\'28\' fill=\'%23E3F6F5\' font-family=\'sans-serif\' text-anchor=\'middle\' dominant-baseline=\'middle\'>📋</text></svg>';">

      <div id="login-message" style="color: red; margin-bottom: 10px; font-size: 0.9rem;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Email</label>
          <input type="email" id="usuario" name="usuario" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 15px;">
          <button type="submit" class="btn" style="flex: 1;">Iniciar sesión</button>
          <button type="button" class="btn" style="flex: 1;" onclick="location.href='pagina2.html'">Registrarse</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Admin Tareas</p>
  </footer>

  <script src="../scripts/main.js"></script>
</body>
</html>
