<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 3 - Mis Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <header>
    <h1>Panel de Control de Tareas</h1>
    <img id="logo" src="../img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'20\' fill=\'%23A7E0DB\'/></svg>'">
  </header>

  <main class="grid-tareas">
    <!-- Contenedor dinámico de lista de tareas -->
    <section class="lista-tareas">
      <h3>Tareas Pendientes</h3>
      <div id="contenedor-tareas">
        <p>Cargando tareas...</p>
      </div>
    </section>

    <!-- Formulario para agregar una nueva tarea -->
    <section class="formulario-tarea">
      <h3>Nueva Tarea</h3>
      <form id="newTaskForm">
        <div class="form-group">
          <label for="titulo">Título de la Tarea</label>
          <input type="text" id="titulo" name="titulo" required>
        </div>
        <div class="form-group">
          <label for="desc">Descripción</label>
          <textarea id="desc" name="desc" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label for="fechas">Fecha de Término</label>
          <input type="date" id="fechas" name="fechas" required>
        </div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex:1;">
            <label for="prio">Prioridad</label>
            <select id="prio" name="prio">
              <option value="Alta">Alta</option>
              <option value="Media" selected>Media</option>
              <option value="Baja">Baja</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label for="cat">Categoría</label>
            <input type="text" id="cat" name="cat" placeholder="Ej. Trabajo">
          </div>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Guardar Tarea</button>
      </form>
    </section>

    <!-- Lateral de avisos -->
    <aside class="avisos-tarea" style="display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <h3>Avisos de Tareas</h3>
        <div id="contenedor-avisos">
          <p style="font-size: 0.85rem; color: #d9534f;">⚠️ Revisa tus fechas límite próximas.</p>
        </div>
      </div>
      <button type="button" class="btn" onclick="location.href='pagina4.html'">Ir al Calendario</button>
    </aside>
  </main>

  <footer>
    <p>&copy; 2026 Admin Tareas</p>
  </footer>

  <script src="../scripts/main.js"></script>
</body>
</html>
