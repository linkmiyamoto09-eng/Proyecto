<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 2 - Registro de Usuario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <header style="justify-content: space-between;">
    <h1>Crear Cuenta</h1>
    <img id="logo" src="../img/logo.png" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><circle cx=\'25\' cy=\'25\' r=\'20\' fill=\'%23A7E0DB\'/></svg>'">
  </header>

  <main>
    <section class="form-container">
      <div id="register-message" style="margin-bottom: 10px; font-size: 0.9rem;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-group">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" name="pass" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPass">Confirmar Contraseña</label>
          <input type="password" id="confirmPass" name="confirmPass" required minlength="6">
        </div>
        <div style="display: flex; justify-content: space-between; gap: 10px; margin-top: 15px;">
          <button type="submit" class="btn" style="flex: 1;">Registrarse</button>
          <button type="button" class="btn" style="flex: 1;" onclick="location.href='pagina1.html'">Volver al Login</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Admin Tareas</p>
  </footer>

  <script src="../scripts/main.js"></script>
</body>
</html>
